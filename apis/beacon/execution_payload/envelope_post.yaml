post:
  operationId: publishExecutionPayloadEnvelope
  summary: Publish execution payload envelope
  description: |
    Instructs the beacon node to broadcast an execution payload envelope and its blobs to the
    network, to be gossiped for payload validation. A success response (20x) indicates
    that the envelope passed gossip validation and that the envelope and its blobs have been
    broadcast onto the network, by this request or before it.
    The beacon node is also expected to integrate the envelope into the state, but may broadcast it
    before doing so, so as to aid timely delivery of the envelope. Should the envelope fail full
    validation, a separate success response code (202) is used to indicate that the envelope was
    successfully broadcast but failed integration. As the envelope carries no signature, this
    means that the execution payload or its blob data is invalid. The broadcast behaviour may be
    adjusted via the `broadcast_validation` query parameter.

    The request body is an `ExecutionPayloadEnvelopeContents` object containing the envelope
    along with blobs and KZG proofs. The envelope is not signed: the beacon block with root
    `beacon_block_root` commits to every field of the envelope. Before it broadcasts or stores
    anything from the request, the beacon node MUST check the envelope against the execution
    payload bid of that block, and MUST verify the blobs and KZG proofs against the
    `blob_kzg_commitments` of that bid. If either check fails, it returns a 400.

    This endpoint is used by builders, and by a validator client which self-built a block
    with `include_payload=true`. A beacon node which self-built a block broadcasts the envelope
    itself, see `produceBlockV4`, so the beacon node may already have seen the envelope
    submitted here. The checks above and the requested `broadcast_validation` apply in either
    case, and a request which fails them is rejected with a 400 without anything being
    broadcast. Otherwise, if the beacon node has already seen the envelope, it does not broadcast
    the envelope again, but it MUST still broadcast the blob data of the request which it has not
    seen on the network, and then returns a 200.

    If the beacon node has not seen the beacon block with root `beacon_block_root`, it SHOULD
    wait for the block before it responds, as the block may have been published through another
    beacon node. It waits no longer than the end of the slot of the envelope, `payload.slot_number`,
    and returns a 404 if the block has not arrived by then, or at once if that slot has passed.
  tags:
    - Beacon
    - ValidatorRequiredApi
  parameters:
    - name: broadcast_validation
      in: query
      required: false
      description: |
        Level of validation that must be applied to an envelope before it is broadcast.

        Possible values:
        - **`gossip`** (default): lightweight gossip checks only
        - **`consensus`**: full consensus checks, including validation of all envelope fields
          against the beacon block.
        - **`consensus_and_equivocation`**: the same as `consensus`, with an extra check that
          the envelope's beacon block is not an equivocation. If the block is found to be an
          equivocation, validation fails. This is recommended for builders to protect against
          unbundling attacks where a malicious proposer publishes equivocating blocks to extract
          payload contents from honest builders.

        If the envelope fails the requested level of validation, a 400 status MUST be returned
        immediately and the envelope MUST NOT be broadcast to the network.

        If validation succeeds, the envelope must still be fully verified before it is
        incorporated into the state and a 20x status is returned to the caller.
      schema:
        $ref: '../../../beacon-node-oapi.yaml#/components/schemas/BroadcastValidation'
    - in: header
      schema:
        $ref: "../../../beacon-node-oapi.yaml#/components/schemas/ConsensusVersion"
      required: true
      name: Eth-Consensus-Version
      description: "The active consensus version to which the execution payload envelope being submitted belongs."
  requestBody:
    description: "The `ExecutionPayloadEnvelopeContents` object to be broadcast."
    required: true
    content:
      application/json:
        schema:
          $ref: "../../../beacon-node-oapi.yaml#/components/schemas/Gloas.ExecutionPayloadEnvelopeContents"
      application/octet-stream:
        schema:
          description: "SSZ serialized `ExecutionPayloadEnvelopeContents` bytes."
  responses:
    "200":
      description: "The envelope was validated successfully and has been broadcast, by this request or before it. It has also been integrated into the beacon node's database."
    "202":
      description: "The envelope could not be integrated into the beacon node's database as it failed validation, but was successfully broadcast."
    "400":
      description: "The envelope object is invalid, it or its blob data does not match the execution payload bid of its beacon block, or broadcast validation failed."
      content:
        application/json:
          schema:
            $ref: "../../../beacon-node-oapi.yaml#/components/schemas/ErrorMessage"
          example:
            code: 400
            message: "Invalid execution payload envelope"
    "404":
      description: "The beacon block of the envelope has not been seen."
      content:
        application/json:
          schema:
            $ref: "../../../beacon-node-oapi.yaml#/components/schemas/ErrorMessage"
          example:
            code: 404
            message: "Beacon block not found"
    "415":
      $ref: "../../../beacon-node-oapi.yaml#/components/responses/UnsupportedMediaType"
    "500":
      $ref: "../../../beacon-node-oapi.yaml#/components/responses/InternalError"
    "503":
      $ref: "../../../beacon-node-oapi.yaml#/components/responses/CurrentlySyncing"
