post:
  operationId: publishExecutionPayloadBid
  summary: Publish signed execution payload bid
  description: |
    Instructs the beacon node to broadcast a signed execution payload bid to the network,
    to be gossiped for potential inclusion in block building. The beacon node MAY run gossip
    validation on the bid before broadcasting it, but is not required to do so as the builder
    submitting the bid is a trusted component which is expected to only produce valid bids.
    A success response (20x) indicates that the bid was successfully broadcast onto the network.
  tags:
    - Beacon
  parameters:
    - in: header
      schema:
        $ref: "../../../beacon-node-oapi.yaml#/components/schemas/ConsensusVersion"
      required: true
      name: Eth-Consensus-Version
      description: "The active consensus version to which the execution payload bid being submitted belongs."
  requestBody:
    description: "The `SignedExecutionPayloadBid` object to be broadcast."
    required: true
    content:
      application/json:
        schema:
          $ref: "../../../beacon-node-oapi.yaml#/components/schemas/Gloas.SignedExecutionPayloadBid"
      application/octet-stream:
        schema:
          description: "SSZ serialized `SignedExecutionPayloadBid` bytes. Use Content-Type header to specify this format"
  responses:
    "200":
      description: "The bid has been broadcast."
    "400":
      description: "The `SignedExecutionPayloadBid` object is invalid or, if the beacon node validates bids, failed gossip validation"
      content:
        application/json:
          schema:
            $ref: "../../../beacon-node-oapi.yaml#/components/schemas/ErrorMessage"
          example:
            code: 400
            message: "Invalid signed execution payload bid"
    "415":
      $ref: "../../../beacon-node-oapi.yaml#/components/responses/UnsupportedMediaType"
    "500":
      $ref: "../../../beacon-node-oapi.yaml#/components/responses/InternalError"
