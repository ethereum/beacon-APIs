get:
  operationId: "getPendingDeposits"
  summary: "Get State Pending Deposits"
  description: |
    Returns pending deposits for state with given 'stateId'. Should return 400 if the state retrieved is prior to Electra.
  tags:
    - Beacon
  parameters:
    - name: state_id
      in: path
      $ref: '../../../beacon-node-oapi.yaml#/components/parameters/StateId'
  responses:
    "200":
      description: Success
      headers:
        Eth-Consensus-Version:
          $ref: '../../../beacon-node-oapi.yaml#/components/headers/Eth-Consensus-Version'
          description: "The active consensus version to which the pending deposits belong."
      content:
        application/json:
          schema:
            title: GetPendingDepositsResponse
            type: object
            required: [version, execution_optimistic, finalized, data]
            properties:
              version:
                $ref: "../../../beacon-node-oapi.yaml#/components/schemas/ConsensusVersion"
                example: "gloas"
              execution_optimistic:
                $ref: "../../../beacon-node-oapi.yaml#/components/schemas/ExecutionOptimistic"
              finalized:
                $ref: "../../../beacon-node-oapi.yaml#/components/schemas/Finalized"
              data:
                type: array
                items:
                  $ref: "../../../beacon-node-oapi.yaml#/components/schemas/Electra.PendingDeposit"
            oneOf:
              - properties:
                  version:
                    enum: [electra, fulu]
                  data:
                    type: array
                    maxItems: 134217728
              - properties:
                  version:
                    enum: [gloas]
        application/octet-stream:
          schema:
            description: "SSZ serialized `List[PendingDeposit, PENDING_DEPOSITS_LIMIT]` bytes before Gloas or `ProgressiveList[PendingDeposit]` bytes from Gloas onwards. Use the `Eth-Consensus-Version` response header to select the type."
    "400":
      $ref: '../../../beacon-node-oapi.yaml#/components/responses/InvalidRequest'
    "404":
      $ref: '../../../beacon-node-oapi.yaml#/components/responses/NotFound'
    "406":
      $ref: '../../../beacon-node-oapi.yaml#/components/responses/NotAcceptable'
    "500":
      $ref: '../../../beacon-node-oapi.yaml#/components/responses/InternalError'
