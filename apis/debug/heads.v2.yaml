get:
  operationId: getDebugChainHeadsV2
  summary: Get fork choice leaves
  description: |
    Retrieves all possible chain heads (leaves of fork choice tree).

    From Gloas onwards, a leaf is a `(root, payload_status)` node, so a block can be returned twice,
    once as its `empty` and once as its `full` node. For pre-Gloas leaves, `payload_status` must be `full`.
  tags:
    - Debug
  responses:
    "200":
      description: Success
      content:
        application/json:
          schema:
            title: GetDebugChainHeadsResponse
            type: object
            required: [data]
            properties:
              data:
                type: array
                items:
                  type: object
                  required: [root, slot, execution_optimistic, payload_status]
                  properties:
                    root:
                      $ref: "../../beacon-node-oapi.yaml#/components/schemas/Root"
                    slot:
                      $ref: "../../beacon-node-oapi.yaml#/components/schemas/Uint64"
                    execution_optimistic:
                      $ref: "../../beacon-node-oapi.yaml#/components/schemas/ExecutionOptimistic"
                    payload_status:
                      type: string
                      enum: [empty, full]
                      description: |
                        - `empty`: the node representing this block without its execution payload, even if the payload has been received.
                        - `full`: the node representing this block with its execution payload.
    "500":
      $ref: "../../beacon-node-oapi.yaml#/components/responses/InternalError"
