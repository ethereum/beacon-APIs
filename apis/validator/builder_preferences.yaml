post:
  operationId: "submitBuilderPreferences"
  summary: Submit builder preferences
  description: |
    Submits a proposer's per-builder preferences on the validator client's behalf, one builder-API
    preference submission per entry. The validator client does not contact builders directly. Each
    entry's `auth.message.slot` is the proposal slot the preferences apply to.

    Validators MAY call this endpoint in the epoch prior to the epoch in which they will be
    proposing, as determined from `state.proposer_lookahead`, so that builders have the preferences
    before the bid request arrives.

    This API is applicable from the Gloas fork onwards.
  parameters:
    - name: pubkey
      in: path
      required: true
      description: |
        The BLS public key of the proposing validator whose preferences these are. The beacon node
        passes it as the `proposer_pubkey` of each builder-API preference submission, and each
        entry's `auth` is signed by this key.
      schema:
        $ref: "../../types/primitive.yaml#/Pubkey"
  tags:
    - Validator
  requestBody:
    required: true
    description: |
      The `BuilderPreferenceEntry` objects to submit. Inclusion is best-effort: the beacon node
      submits each entry independently and skips any entry it cannot submit rather than failing the
      whole request. Entries that were not submitted are reported by index in a 400 response.
    content:
      application/json:
        schema:
          type: array
          maxItems: 64  # MAX_BUILDER_ENTRIES
          items:
            $ref: "../../beacon-node-oapi.yaml#/components/schemas/Gloas.BuilderPreferenceEntry"
      application/octet-stream:
        schema:
          description: "SSZ serialized `List[BuilderPreferenceEntryV1, MAX_BUILDER_ENTRIES]` bytes (see the `BuilderPreferenceEntry` type description for the container). Use Content-Type header to indicate that SSZ data is contained in the request body."
  responses:
    "200":
      description: "Every entry was submitted"
    "400":
      description: "Invalid request, or errors with one or more preference submissions"
      content:
        application/json:
          schema:
            $ref: "../../beacon-node-oapi.yaml#/components/schemas/IndexedErrorMessage"
    "415":
      $ref: "../../beacon-node-oapi.yaml#/components/responses/UnsupportedMediaType"
    "500":
      $ref: "../../beacon-node-oapi.yaml#/components/responses/InternalError"
    "503":
      $ref: "../../beacon-node-oapi.yaml#/components/responses/CurrentlySyncing"
