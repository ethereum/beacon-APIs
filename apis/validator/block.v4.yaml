post:
  tags:
    - Validator
    - ValidatorRequiredApi
  operationId: "produceBlockV4"
  summary: "Produce a new block, without signature."
  description: |
    Requests a beacon node to produce a valid block, which the validator then signs.

    The beacon node always builds a local payload and MAY consider a p2p bid, so a block is returned
    even when no bid is available. The validator client optionally supplies a list of `BuilderEntry`
    objects in the request body, one per builder-API bid request to make. Each builder's bid is
    rejected if it falls outside its own entry's `min_bid` or `max_execution_payment`, and is then
    boosted by that entry's `builder_boost_factor`. The highest boosted bid, the local build and any
    p2p bid are compared in Gwei, and the highest wins.

    The response carries the full block contents only when the beacon node self-built the block and
    `include_payload` is `true`; in every other case, including any bid win, it carries only the
    `BeaconBlock`. Response metadata reports which form was returned and, when a builder-API bid
    won, which builder won it.

    Notes:
    - A self-built block is published via `POST /eth/v2/beacon/blocks`, and its envelope via
      `POST /eth/v1/beacon/execution_payload_envelopes`.
    - A block won through the builder-API channel is published via `POST /eth/v2/beacon/blocks`
      echoing `Eth-Builder-Url`, and the winning builder releases the envelope.
    - A block won by a p2p bid is published via `POST /eth/v2/beacon/blocks` without the header,
      and the bidding builder releases the envelope.

    This endpoint is specific to the post-Gloas forks and is not backwards compatible with previous
    forks.
  parameters:
    - name: slot
      in: path
      required: true
      description: "The slot for which the block should be proposed."
      schema:
        $ref: "../../beacon-node-oapi.yaml#/components/schemas/Uint64"
    - name: randao_reveal
      in: query
      required: true
      description: "The validator's randao reveal value."
      schema:
        $ref: '../../beacon-node-oapi.yaml#/components/schemas/Signature'
    - name: graffiti
      in: query
      required: false
      description: "Arbitrary data validator wants to include in block."
      schema:
        $ref: '../../beacon-node-oapi.yaml#/components/schemas/Graffiti'
    - name: skip_randao_verification
      $ref: '../../beacon-node-oapi.yaml#/components/parameters/SkipRandaoVerification'
    - name: include_payload
      in: query
      required: true
      description: |
        Whether a self-built block's response carries the execution payload inline, or omits it for
        the beacon node to cache and the validator client to retrieve separately.

        When `true`, a self-built response includes the full block contents (beacon block, execution
        payload envelope, blobs, and KZG proofs) and reports `Eth-Execution-Payload-Included: true`.
        The validator client holds the whole payload, so it can sign and publish the envelope through
        any beacon node (stateless operation: multi-BN setups, distributed validators, failover).

        When `false`, a self-built response returns only the beacon block, reporting
        `Eth-Execution-Payload-Included: false`; the beacon node caches the execution payload
        envelope and blobs. The validator client retrieves the envelope via
        `GET /eth/v1/validator/execution_payload_envelopes/{slot}/{beacon_block_root}`, signs it, and
        publishes it via `POST /eth/v1/beacon/execution_payload_envelopes`, and the producing beacon
        node attaches its cached blobs and KZG proofs before broadcasting. This sends fewer bytes but
        ties publishing to that one beacon node (stateful operation).

        This parameter affects the self-built case only. When a bid wins, the beacon node does not
        hold that payload, so it returns only the beacon block regardless of this parameter.
      schema:
        type: boolean
  requestBody:
    required: false
    description: |
      The `BuilderEntry` objects to solicit bids from. Each entry's `auth.message.slot` is the
      `slot` this request is for; the builder rejects a mismatch, so an entry naming a different slot
      is one the beacon node does not use. An entry the beacon node cannot use, for any reason, MUST
      NOT fail the request; it simply yields no bid, so one bad entry never costs the proposer its
      slot. When the body is omitted or empty, no external builders are contacted.
    content:
      application/json:
        schema:
          type: array
          maxItems: 64  # MAX_BUILDER_ENTRIES
          items:
            $ref: "../../beacon-node-oapi.yaml#/components/schemas/Gloas.BuilderEntry"
      application/octet-stream:
        schema:
          description: "SSZ serialized `List[BuilderEntryV1, MAX_BUILDER_ENTRIES]` bytes (see the `BuilderEntry` type description for the container and constants). Use Content-Type header to indicate that SSZ data is contained in the request body."
  responses:
    "200":
      description: Success response
      headers:
        Eth-Consensus-Version:
          $ref: '../../beacon-node-oapi.yaml#/components/headers/Eth-Consensus-Version'
        Eth-Consensus-Block-Value:
          $ref: '../../beacon-node-oapi.yaml#/components/headers/Eth-Consensus-Block-Value'
        Eth-Execution-Payload-Included:
          $ref: '../../beacon-node-oapi.yaml#/components/headers/Eth-Execution-Payload-Included'
        Eth-Builder-Url:
          description: |
            When the winning bid came through the builder-API channel, the `url` of that builder.
            The validator echoes this value in the `Eth-Builder-Url` request header when publishing
            the signed block, so the beacon node can forward the block to the same builder via the
            builder-API `submitSignedBeaconBlock`. Absent when the block was self-built or the
            winning bid came from the p2p network.
          required: false
          schema:
            type: string
            format: uri
            example: "https://builder.example.com"
      content:
        application/json:
          schema:
            title: "ProduceBlockV4Response"
            type: object
            required: [version, consensus_block_value, execution_payload_included, data]
            properties:
              version:
                type: string
                enum: [gloas]
                example: "gloas"
              consensus_block_value:
                type: string
                example: "12345"
                description: "Consensus rewards for this block in Wei"
              execution_payload_included:
                type: boolean
                description: |
                  Indicates whether the execution payload envelope is included in the response.
                  When `true`, the `data` field contains a `BlockContents` object with the
                  beacon block, execution payload envelope, KZG proofs, and blobs. When `false`,
                  the `data` field contains only a `BeaconBlock`.
                example: false
              data:
                anyOf:
                  - $ref: "../../beacon-node-oapi.yaml#/components/schemas/Gloas.BeaconBlock"
                  - $ref: "../../beacon-node-oapi.yaml#/components/schemas/Gloas.BlockContents"
        application/octet-stream:
          schema:
            description: "SSZ serialized `BeaconBlock` or `BlockContents` bytes. Use Accept header to choose this response type, version string is sent in header `Eth-Consensus-Version` and payload inclusion indicated by `Eth-Execution-Payload-Included` header."
    "400":
      description: "Invalid block production request"
      content:
        application/json:
          schema:
            $ref: "../../beacon-node-oapi.yaml#/components/schemas/ErrorMessage"
          examples:
            InvalidRequest:
              value:
                code: 400
                message: "Invalid request to produce a block"
    "406":
      $ref: "../../beacon-node-oapi.yaml#/components/responses/NotAcceptable"
    "415":
      $ref: "../../beacon-node-oapi.yaml#/components/responses/UnsupportedMediaType"
    "500":
      $ref: '../../beacon-node-oapi.yaml#/components/responses/InternalError'
    "503":
      $ref: '../../beacon-node-oapi.yaml#/components/responses/CurrentlySyncing'
