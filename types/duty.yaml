AttesterDuty:
  type: object
  required: [pubkey, validator_index, committee_index, committee_length, committees_at_slot, validator_committee_index, slot]
  properties:
    pubkey:
      oneOf:
        - $ref: './primitive.yaml#/Pubkey'
        - $ref: './primitive.yaml#/XmssPubkey'
      description: "The validator's BLS public key, or its XMSS public key from the PQ fork onwards."
    validator_index:
      $ref: "./primitive.yaml#/Uint64"
      description: "Index of validator in validator registry"
    committee_index:
      $ref: "./primitive.yaml#/Uint64"
      description: "The committee index"
    committee_length:
      $ref: "./primitive.yaml#/Uint64"
      description: "Number of validators in committee"
    committees_at_slot:
      $ref: "./primitive.yaml#/Uint64"
      description: "Number of committees at the provided slot"
    validator_committee_index:
      $ref: "./primitive.yaml#/Uint64"
      description: "Index of validator in committee"
    slot:
      $ref: "./primitive.yaml#/Uint64"
      description: "The slot at which the validator must attest."
    is_aggregator:
      type: boolean
      description: "[New in PQ] True if the validator is in the aggregation committee for this slot and committee. Aggregators are assigned by the beacon state, so no selection proof is computed. Absent before the PQ fork."
    aggregator_position:
      $ref: "./primitive.yaml#/Uint64"
      description: "[New in PQ] The validator's index in `get_aggregation_committee(state, slot, committee_index)`, present only when `is_aggregator` is true. Aggregators are staggered by this position: the aggregator stops collecting attestations `get_aggregation_cutoff_ms(aggregator_position)` milliseconds into the slot and broadcasts its aggregate `get_aggregate_due_ms(aggregator_position)` milliseconds into the slot."

ProposerDuty:
  type: object
  required: [pubkey, validator_index, slot]
  properties:
    pubkey:
      oneOf:
        - $ref: './primitive.yaml#/Pubkey'
        - $ref: './primitive.yaml#/XmssPubkey'
      description: "The validator's BLS public key, or its XMSS public key from the PQ fork onwards."
    validator_index:
      $ref: "./primitive.yaml#/Uint64"
      description: "Index of validator in validator registry."
    slot:
      $ref: "./primitive.yaml#/Uint64"
      description: "The slot at which the validator must propose block."

Altair:
  SyncDuty:
    type: object
    required: [pubkey, validator_index, validator_sync_committee_indices]
    properties:
      pubkey:
        $ref: './primitive.yaml#/Pubkey'
      validator_index:
        $ref: "./primitive.yaml#/Uint64"
        description: "Index of validator in validator registry."
      validator_sync_committee_indices:
        type: array
        description: "The indices of the validator in the sync committee."
        minItems: 1
        items:
          $ref: './primitive.yaml#/Uint64'

PtcDuty:
  type: object
  required: [pubkey, validator_index, slot]
  properties:
    pubkey:
      oneOf:
        - $ref: './primitive.yaml#/Pubkey'
        - $ref: './primitive.yaml#/XmssPubkey'
      description: "The validator's BLS public key, or its XMSS public key from the PQ fork onwards."
    validator_index:
      $ref: "./primitive.yaml#/Uint64"
      description: "Index of validator in validator registry."
    slot:
      $ref: "./primitive.yaml#/Uint64"
      description: "The slot at which the validator must perform PTC duties."
