Gloas:
  BuilderPreferenceEntry:
    type: object
    description: |
      A per-builder preference the validator client asks the beacon node to submit ahead of the bid
      request, one entry per submission. Unlike the block-production `BuilderEntry` it carries only
      what a builder may see: `min_bid` and `builder_boost_factor` are the proposer's private
      bid-filtering strategy and are never sent to a builder.

      The entry pairs the beacon node's routing with the payload the builder receives, so like
      `BuilderEntry` it has no Builder API definition. Its SSZ container uses that type's constants
      and the
      [`SignedRequestAuthV1`](https://github.com/ethereum/builder-specs/blob/78a5546d9d8253beabf7db8baf988a58abdec87f/specs/gloas/validator.md#signedrequestauthv1) object from the Builder API Gloas spec:

          class BuilderPreferenceEntryV1(Container):
              url: ByteList[MAX_BUILDER_URL_SIZE]  # UTF-8 bytes of `url`, exactly as in JSON
              auth: SignedRequestAuthV1
              max_execution_payment: Gwei
    required: [url, auth, max_execution_payment]
    properties:
      url:
        type: string
        format: uri
        maxLength: 2048  # MAX_BUILDER_URL_SIZE
        description: "The URL this entry's preferences are submitted to. Multiple entries MAY share a `url`; the beacon node makes one submission per entry."
        example: "https://builder.example.com"
      auth:
        description: "Authenticates this submission to the builder. The beacon node MUST forward `message` and `signature` byte-for-byte unchanged."
        allOf:
          - $ref: "./request_auth.yaml#/Gloas/SignedRequestAuthV1"
      max_execution_payment:
        allOf:
          - $ref: "../primitive.yaml#/Gwei"
          - description: "Maximum execution-layer payment, in Gwei, submitted to this builder so it can shape its bid."
            example: "1000000000"
