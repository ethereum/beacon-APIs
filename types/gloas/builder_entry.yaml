Gloas:
  BuilderEntry:
    type: object
    description: |
      A per-builder input the validator client supplies on a block-production request, one entry per
      builder-API bid request the beacon node should make. `auth` is the
      [`SignedRequestAuthV1`](https://github.com/ethereum/builder-specs/blob/78a5546d9d8253beabf7db8baf988a58abdec87f/specs/gloas/validator.md#signedrequestauthv1) object from the Builder API Gloas spec.

      A `BuilderEntry` never reaches a builder, so it has no Builder API definition. Its SSZ
      container and constants are:

          MAX_BUILDER_ENTRIES = 64
          MAX_BUILDER_URL_SIZE = 2048

          class BuilderEntryV1(Container):
              url: ByteList[MAX_BUILDER_URL_SIZE]  # UTF-8 bytes of `url`, exactly as in JSON
              auth: SignedRequestAuthV1
              pubkey: BLSPubkey
              max_execution_payment: Gwei
              min_bid: Gwei
              builder_boost_factor: uint64

      SSZ cannot express absence, so an all-zero `pubkey`, which is not a valid BLS public key, is
      treated as unset in either encoding.
    required: [url, auth, max_execution_payment, min_bid, builder_boost_factor]
    properties:
      url:
        type: string
        format: uri
        maxLength: 2048  # MAX_BUILDER_URL_SIZE
        description: "The URL this entry's bid request is sent to. Multiple entries MAY share a `url`; the beacon node makes one request per entry."
        example: "https://builder.example.com"
      auth:
        description: "Authenticates this request to the builder. The beacon node MUST forward `message` and `signature` byte-for-byte unchanged."
        allOf:
          - $ref: "./request_auth.yaml#/Gloas/SignedRequestAuthV1"
      pubkey:
        description: "Optional builder BLS public key. When set, bids not signed by it MUST NOT be accepted."
        allOf:
          - $ref: "../primitive.yaml#/Pubkey"
      max_execution_payment:
        allOf:
          - $ref: "../primitive.yaml#/Gwei"
          - description: "Maximum trusted execution-layer payment, in Gwei, accepted from this builder. A bid promising more MUST be rejected."
            example: "1000000000"
      min_bid:
        allOf:
          - $ref: "../primitive.yaml#/Gwei"
          - description: "Minimum total payment, in Gwei, accepted from this builder. A bid whose `value` plus `execution_payment` is below this MUST be rejected."
            example: "10000000"
      builder_boost_factor:
        allOf:
          - $ref: "../primitive.yaml#/Uint64"
          - description: |
              Percentage multiplier applied to this builder's bid once it has passed the
              `max_execution_payment` and `min_bid` checks, giving
              `builder_boost_factor * (builder_payload_value // 100)`, where
              `builder_payload_value` is the bid's `value` plus its `execution_payment`. All
              candidates are compared in Gwei and the highest boosted value wins, so a factor below
              `100` favours the local payload and one above `100` favours this builder.

              Servers must support the following values, which encode common preferences:

              * `builder_boost_factor=0`: prefer the local payload unless an error makes it unviable.
              * `builder_boost_factor=100`: profit maximization mode; choose whichever pays more.
              * `builder_boost_factor=2**64 - 1`: prefer this builder unless an error or health check
                makes it unviable.

              Servers should use saturating arithmetic so that large values do not overflow.
            example: "100"
