Gloas:
  BuilderEntry:
    type: object
    description: |
      A per-builder input the validator client supplies on a block-production request. At least one
      of `url` and `builder_pubkey` MUST be present.

      An entry that contains a `url` is a bid request. It MUST also contain an `auth`, which the
      builder requires on every request, and the beacon node MUST NOT send a request for an entry
      that has a `url` without one. No two such entries may share both that `url` and their
      `auth`'s `data`, and one request is made per entry, so several MAY share a `url` with
      different `data`.

      An entry with no `url` supplies p2p policy instead, and no two of them may share a
      `builder_pubkey`; if they do, the beacon node applies the first and ignores the rest.

      `auth` is the [`SignedRequestAuthV1`](https://github.com/ethereum/builder-specs/blob/78a5546d9d8253beabf7db8baf988a58abdec87f/specs/gloas/validator.md#signedrequestauthv1) object from the Builder API Gloas spec.

      A `BuilderEntry` never reaches a builder, so it has no Builder API definition. Its SSZ
      container and constants are:

          MAX_BUILDER_ENTRIES = 64
          MAX_BUILDER_URL_SIZE = 2048

          class BuilderEntry(Container):
              url: ByteList[MAX_BUILDER_URL_SIZE]  # UTF-8 bytes of `url`, exactly as in JSON
              auth: SignedRequestAuth
              builder_pubkey: BLSPubkey
              max_execution_payment: Gwei
              min_bid: Gwei
              builder_boost_factor: uint64

      SSZ cannot express absence, so each optional field has a value that means unset in either
      encoding: a zero-length `url`, an all-zero `builder_pubkey`, which is not a valid BLS public
      key, and an `auth` whose `data` is zero-length and whose `signature` is all-zero.
    required: [max_execution_payment, min_bid, builder_boost_factor]
    properties:
      url:
        type: string
        format: uri
        maxLength: 2048  # MAX_BUILDER_URL_SIZE
        description: "Where this entry's bid request is sent. Omit it to supply policy for this builder's p2p bids without requesting one."
        example: "https://builder.example.com"
      auth:
        description: "Authenticates this entry's bid request to the builder. The beacon node MUST forward `message` and `signature` byte-for-byte unchanged. Required when `url` is present; omit it only on an entry that requests no bid."
        allOf:
          - $ref: "./request_auth.yaml#/Gloas/SignedRequestAuth"
      builder_pubkey:
        description: "The builder's BLS public key. On an entry with a `url` it filters the response: a builder-API bid not signed by it MUST NOT be accepted. On an entry without one it identifies the builder whose p2p bids this entry applies to."
        allOf:
          - $ref: "../primitive.yaml#/Pubkey"
      max_execution_payment:
        allOf:
          - $ref: "../primitive.yaml#/Gwei"
          - description: "Maximum execution-layer payment, in Gwei, the proposer will accept from this builder. Its effect on bid selection is specified in the builder-specs."
            example: "1000000000"
      min_bid:
        allOf:
          - $ref: "../primitive.yaml#/Gwei"
          - description: "Minimum total payment, in Gwei, accepted from this builder. A bid whose `value` plus `execution_payment` is below this MUST be rejected."
            example: "10000000"
      builder_boost_factor:
        allOf:
          - $ref: "../primitive.yaml#/Uint64"
          - description: |
              Percentage multiplier applied to this builder's bid once it has passed the
              `min_bid` check, giving
              `builder_boost_factor * (builder_bid_value // 100)`, where
              `builder_bid_value` is the bid's `value` plus its `execution_payment`. The
              highest boosted bid competes with the local payload in Gwei, so a factor below `100`
              favors the local payload and one above `100` favors this builder.

              Servers must support the following values, which encode common preferences:

              * `builder_boost_factor=0`: prefer the local payload unless an error makes it unviable.
              * `builder_boost_factor=100`: profit maximization mode; choose whichever pays more.
              * `builder_boost_factor=2**64 - 1`: prefer this builder unless an error or health check
                makes it unviable.

              Servers should use saturating arithmetic so that large values do not overflow.
            example: "100"
  BuilderConfig:
    type: object
    description: |
      The resolved per-key builder config the validator client sends on a block-production request.
      Entries arrive fully resolved, so a requested bid is governed by its own `BuilderEntry`; the
      top-level `min_bid` and `builder_boost_factor` apply only to a bid that matches no entry,
      which in practice is a bid received over p2p.

      Its SSZ container is:

          class BuilderConfig(Container):
              min_bid: Gwei
              builder_boost_factor: uint64
              builders: List[BuilderEntry, MAX_BUILDER_ENTRIES]
    required: [min_bid, builder_boost_factor, builders]
    properties:
      min_bid:
        allOf:
          - $ref: "../primitive.yaml#/Gwei"
          - description: "Minimum total payment, in Gwei, accepted from a bid that matches no entry, which in practice is a p2p bid. A bid whose `value` plus `execution_payment` is below this MUST be rejected."
            example: "10000000"
      builder_boost_factor:
        allOf:
          - $ref: "../primitive.yaml#/Uint64"
          - description: "Percentage multiplier applied to a bid that matches no entry, exactly as a `BuilderEntry`'s `builder_boost_factor` is applied to a bid from that entry."
            example: "100"
      builders:
        type: array
        maxItems: 64  # MAX_BUILDER_ENTRIES
        description: "The builders to request bids from, one `BuilderEntry` each. Empty means request none, so only p2p bids are considered."
        items:
          $ref: "#/Gloas/BuilderEntry"
