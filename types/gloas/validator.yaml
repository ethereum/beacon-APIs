Gloas:
  AggregateAndProof:
    allOf:
      - $ref: "#/Gloas/Aggregate"
      - type: object
        required: [selection_proof]
        properties:
          selection_proof:
            $ref: "../primitive.yaml#/Signature"

  Aggregate:
    type: object
    description: "The [`AggregateAndProof`](https://github.com/ethereum/consensus-specs/blob/v1.7.0-beta.0/specs/electra/validator.md#aggregateandproof) without selection_proof"
    required: [aggregator_index, aggregate]
    properties:
      aggregator_index:
        $ref: "../primitive.yaml#/Uint64"
      aggregate:
        $ref: "./attestation.yaml#/Gloas/Attestation"

  SignedAggregateAndProof:
    type: object
    description: "The [`SignedAggregateAndProof`](https://github.com/ethereum/consensus-specs/blob/v1.7.0-beta.0/specs/electra/validator.md#signedaggregateandproof) object"
    required: [message, signature]
    properties:
      message:
        $ref: "#/Gloas/AggregateAndProof"
      signature:
        $ref: "../primitive.yaml#/Signature"
