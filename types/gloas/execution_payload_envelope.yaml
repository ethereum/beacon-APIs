Gloas:
  ExecutionPayloadEnvelope:
    type: object
    description: "The [`ExecutionPayloadEnvelope`](https://github.com/ethereum/consensus-specs/blob/v1.7.0-beta.3/specs/gloas/beacon-chain.md#executionpayloadenvelope) object from the CL Gloas spec."
    required: [payload, execution_requests, beacon_block_root, parent_beacon_block_root]
    properties:
      payload:
        $ref: "./execution_payload.yaml#/Gloas/ExecutionPayload"
      execution_requests:
        $ref: "./execution_requests.yaml#/Gloas/ExecutionRequests"
      beacon_block_root:
        $ref: "../primitive.yaml#/Root"
        description: "Root of the beacon block for this payload"
      parent_beacon_block_root:
        $ref: "../primitive.yaml#/Root"
        description: "Root of the parent beacon block"

  ExecutionPayloadEnvelopeContents:
    type: object
    description: |
      Execution payload envelope bundled with blobs and KZG proofs for publishing. Used by
      builders, and by a validator client which publishes to a beacon node that does not have
      the payload cached (e.g. multi-BN setups, distributed validators, failover).
    required: [execution_payload_envelope, kzg_proofs, blobs]
    properties:
      execution_payload_envelope:
        $ref: "#/Gloas/ExecutionPayloadEnvelope"
      kzg_proofs:
        $ref: "../fulu/block_contents.yaml#/Fulu/KZGProofs"
      blobs:
        $ref: "../deneb/block_contents.yaml#/Deneb/Blobs"
