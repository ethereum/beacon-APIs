Gloas:
  ExecutionBranch:
    type: array
    description: "Merkle proof consisting of [`floorlog2(EXECUTION_BLOCK_HASH_GINDEX_GLOAS)`](https://github.com/ethereum/consensus-specs/blob/v1.7.0-beta.0/specs/gloas/light-client/sync-protocol.md#new-constants) roots"
    items:
      $ref: '../primitive.yaml#/Root'
    minItems: 11
    maxItems: 11

  FinalityBranch:
    type: array
    description: "Merkle proof consisting of [`floorlog2(FINALIZED_ROOT_GINDEX_GLOAS)`](https://github.com/ethereum/consensus-specs/blob/v1.7.0-beta.0/specs/gloas/light-client/sync-protocol.md#new-constants) roots"
    items:
      $ref: '../primitive.yaml#/Root'
    minItems: 9
    maxItems: 9

  CurrentSyncCommitteeBranch:
    type: array
    description: "Merkle proof consisting of [`floorlog2(CURRENT_SYNC_COMMITTEE_GINDEX_GLOAS)`](https://github.com/ethereum/consensus-specs/blob/v1.7.0-beta.0/specs/gloas/light-client/sync-protocol.md#new-constants) roots"
    items:
      $ref: '../primitive.yaml#/Root'
    minItems: 11
    maxItems: 11

  NextSyncCommitteeBranch:
    type: array
    description: "Merkle proof consisting of [`floorlog2(NEXT_SYNC_COMMITTEE_GINDEX_GLOAS)`](https://github.com/ethereum/consensus-specs/blob/v1.7.0-beta.0/specs/gloas/light-client/sync-protocol.md#new-constants) roots"
    items:
      $ref: '../primitive.yaml#/Root'
    minItems: 11
    maxItems: 11

  LightClientHeader:
    type: object
    description: "The [`LightClientHeader`](https://github.com/ethereum/consensus-specs/blob/v1.7.0-beta.0/specs/gloas/light-client/sync-protocol.md#modified-lightclientheader) object from the CL Gloas spec."
    required: [beacon, execution_block_hash, execution_branch]
    properties:
      beacon:
        $ref: '../phase0/block.yaml#/Phase0/BeaconBlockHeader'
      execution_block_hash:
        $ref: '../primitive.yaml#/Hash32'
      execution_branch:
        $ref: '#/Gloas/ExecutionBranch'

  LightClientBootstrap:
    type: object
    required: [header, current_sync_committee, current_sync_committee_branch]
    properties:
      header:
        $ref: '#/Gloas/LightClientHeader'
      current_sync_committee:
        $ref: '../altair/sync_committee.yaml#/Altair/SyncCommittee'
      current_sync_committee_branch:
        $ref: '#/Gloas/CurrentSyncCommitteeBranch'

  LightClientUpdate:
    type: object
    required: [attested_header, next_sync_committee, next_sync_committee_branch, finalized_header, finality_branch, sync_aggregate, signature_slot]
    properties:
      attested_header:
        $ref: '#/Gloas/LightClientHeader'
      next_sync_committee:
        $ref: '../altair/sync_committee.yaml#/Altair/SyncCommittee'
      next_sync_committee_branch:
        $ref: '#/Gloas/NextSyncCommitteeBranch'
      finalized_header:
        $ref: '#/Gloas/LightClientHeader'
      finality_branch:
        $ref: '#/Gloas/FinalityBranch'
      sync_aggregate:
        $ref: '../altair/sync_aggregate.yaml#/Altair/SyncAggregate'
      signature_slot:
        $ref: '../primitive.yaml#/Uint64'

  LightClientFinalityUpdate:
    type: object
    required: [attested_header, finalized_header, finality_branch, sync_aggregate, signature_slot]
    properties:
      attested_header:
        $ref: '#/Gloas/LightClientHeader'
      finalized_header:
        $ref: '#/Gloas/LightClientHeader'
      finality_branch:
        $ref: '#/Gloas/FinalityBranch'
      sync_aggregate:
        $ref: '../altair/sync_aggregate.yaml#/Altair/SyncAggregate'
      signature_slot:
        $ref: '../primitive.yaml#/Uint64'

  LightClientOptimisticUpdate:
    type: object
    required: [attested_header, sync_aggregate, signature_slot]
    properties:
      attested_header:
        $ref: '#/Gloas/LightClientHeader'
      sync_aggregate:
        $ref: '../altair/sync_aggregate.yaml#/Altair/SyncAggregate'
      signature_slot:
        $ref: '../primitive.yaml#/Uint64'
