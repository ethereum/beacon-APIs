Pq:
  PayloadAttestationMessage:
    type: object
    description: "The `PayloadAttestationMessage` object from the CL PQ spec."
    required: [validator_index, data, signature]
    properties:
      validator_index:
        $ref: "../primitive.yaml#/Uint64"
        description: "Index of the validator submitting the payload attestation"
      data:
        $ref: "../gloas/payload_attestation.yaml#/Gloas/PayloadAttestationData"
      signature:
        $ref: "../primitive.yaml#/XmssSignature"
        description: "XMSS signature of the payload attestation data"
