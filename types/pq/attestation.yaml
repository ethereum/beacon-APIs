Pq:
  IndexedAttestation:
    type: object
    description: "The `IndexedAttestation` object from the CL PQ spec."
    required: [attesting_indices, data, proof]
    properties:
      attesting_indices:
        type: array
        maxItems: 131072
        description: "Progressive list of attesting validator indices."
        items:
          $ref: "../primitive.yaml#/Uint64"
      data:
        $ref: "../phase0/attestation_data.yaml#/Phase0/AttestationData"
      proof:
        $ref: "../primitive.yaml#/AttestationProof"
        description: "STARK proof of the XMSS signatures of the attesting indices."

  Attestation:
    type: object
    description: "The `Attestation` object from the CL PQ spec. It carries no signature; the signatures are covered by an `AttestationProof`."
    required: [aggregation_bits, data, committee_bits]
    properties:
      aggregation_bits:
        $ref: "../primitive.yaml#/BitList"
        description: "Progressive bitlist of attester aggregation bits."
      data:
        $ref: "../phase0/attestation_data.yaml#/Phase0/AttestationData"
      committee_bits:
        $ref: "../primitive.yaml#/Bitvector"
        description: "Committee bits, a fixed vector of MAX_COMMITTEES_PER_SLOT_PQ (16) bits."
        minLength: 6
        maxLength: 6
        example: "0x0001"

  SingleAttestation:
    type: object
    description: "The `SingleAttestation` object from the CL PQ spec."
    required: [committee_index, attester_index, data, signature]
    properties:
      committee_index:
        $ref: "../primitive.yaml#/Uint64"
      attester_index:
        $ref: "../primitive.yaml#/Uint64"
      data:
        $ref: "../phase0/attestation_data.yaml#/Phase0/AttestationData"
      signature:
        $ref: "../primitive.yaml#/XmssSignature"

  AggregatedAttestation:
    type: object
    description: "An aggregated `Attestation` together with the STARK proof of its XMSS signatures, as produced by a beacon node for a subscribed aggregator."
    required: [aggregate, proof]
    properties:
      aggregate:
        $ref: "#/Pq/Attestation"
      proof:
        $ref: "../primitive.yaml#/AttestationProof"
