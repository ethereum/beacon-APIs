Pq:
  AttesterSlashing:
    type: object
    description: "The `AttesterSlashing` object from the CL PQ spec, with PQ [`IndexedAttestation`](https://github.com/ethereum/consensus-specs/blob/4c296784b/specs/_features/pq/beacon-chain.md#indexedattestation)s."
    required: [attestation_1, attestation_2]
    properties:
      attestation_1:
        $ref: "./attestation.yaml#/Pq/IndexedAttestation"
      attestation_2:
        $ref: "./attestation.yaml#/Pq/IndexedAttestation"
