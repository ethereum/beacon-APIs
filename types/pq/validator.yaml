Pq:
  Validator:
    type: object
    description: "The [`Validator`](https://github.com/ethereum/consensus-specs/blob/4c296784b/specs/_features/pq/beacon-chain.md#validator) object from the CL PQ spec."
    required: [pubkey, vrf_root, withdrawal_credentials, effective_balance, slashed, activation_eligibility_epoch, activation_epoch, exit_epoch, withdrawable_epoch]
    properties:
      pubkey:
        $ref: "../primitive.yaml#/XmssPubkey"
      vrf_root:
        $ref: "../primitive.yaml#/Root"
        description: "Root of the validator's VRF tree, against which RANDAO reveals are verified."
      withdrawal_credentials:
        $ref: "../primitive.yaml#/Root"
        description: "Root of withdrawal credentials"
      effective_balance:
        $ref: "../primitive.yaml#/Gwei"
        description: "Balance at stake in Gwei."
      slashed:
        type: boolean
        example: false
        description: "Was validator slashed (not longer active)."
      activation_eligibility_epoch:
        $ref: "../primitive.yaml#/Uint64"
        description: "When criteria for activation were met."
      activation_epoch:
        $ref: "../primitive.yaml#/Uint64"
        description: "Epoch when validator activated. 'FAR_FUTURE_EPOCH' if not activated"
      exit_epoch:
        $ref: "../primitive.yaml#/Uint64"
        description: "Epoch when validator exited. 'FAR_FUTURE_EPOCH' if not exited."
      withdrawable_epoch:
        $ref: "../primitive.yaml#/Uint64"
        description: "When validator can withdraw or transfer funds. 'FAR_FUTURE_EPOCH' if not defined"

  AggregateAndProof:
    type: object
    description: "The [`AggregateAndProof`](https://github.com/ethereum/consensus-specs/blob/4c296784b/specs/_features/pq/validator.md#aggregateandproof) object from the CL PQ spec. Aggregators are assigned by the beacon state, so there is no `selection_proof`."
    required: [aggregator_index, aggregate, proof]
    properties:
      aggregator_index:
        $ref: "../primitive.yaml#/Uint64"
      aggregate:
        $ref: "./attestation.yaml#/Pq/Attestation"
      proof:
        $ref: "../primitive.yaml#/AttestationProof"
        description: "STARK proof of the XMSS signatures of the aggregate."

  SignedAggregateAndProof:
    type: object
    description: "The [`SignedAggregateAndProof`](https://github.com/ethereum/consensus-specs/blob/4c296784b/specs/_features/pq/validator.md#signedaggregateandproof) object from the CL PQ spec."
    required: [message, signature]
    properties:
      message:
        $ref: "#/Pq/AggregateAndProof"
      signature:
        $ref: "../primitive.yaml#/XmssSignature"
