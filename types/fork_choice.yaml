Node:
  type: object
  description: "fork choice node attributes"
  required: [slot, block_root, parent_root, justified_epoch, finalized_epoch, weight, validity, execution_block_hash]
  properties:
    slot:
      $ref: './primitive.yaml#/Uint64'
      description: "The slot to which this block corresponds."
    block_root:
      $ref: './primitive.yaml#/Root'
      description: "The signing merkle root of the `BeaconBlock`."
    parent_root:
      $ref: './primitive.yaml#/Root'
      description: "The signing merkle root of the parent `BeaconBlock`."
    justified_epoch:
      $ref: './primitive.yaml#/Uint64'
    finalized_epoch:
      $ref: './primitive.yaml#/Uint64'
    weight:
      $ref: './primitive.yaml#/Uint64'
    validity:
      type: string
      enum: [valid, invalid, optimistic]
    execution_block_hash:
      $ref: './primitive.yaml#/Hash32'
      description: "The `block_hash` from the `execution_payload` of the `BeaconBlock`"
    extra_data:
      $ref: '#/ExtraData'

ExtraData:
  type: object
  description: 'Extra data that may differ between clients. May be empty.'

NodeV2:
  type: object
  description: "A fork choice node, identified by its block root and payload status."
  required: [slot, block_root, payload_status, parent_root, parent_payload_status, justified_epoch, finalized_epoch, weight, validity, execution_block_hash, payload_attester_count, payload_availability_yes_count, payload_data_availability_yes_count, extra_data]
  properties:
    slot:
      $ref: './primitive.yaml#/Uint64'
      description: "The slot of the beacon block."
    block_root:
      $ref: './primitive.yaml#/Root'
      description: "The hash tree root of the beacon block."
    payload_status:
      type: string
      enum: [pending, empty, full]
      description: |
        - `pending`: the beacon block before choosing whether to include its payload. This node remains after the payload is received.
        - `empty`: the path that excludes this block's payload, even if the payload has been received.
        - `full`: the path that includes this block's payload.
    parent_root:
      $ref: './primitive.yaml#/Root'
      description: |
        The block root of the parent fork choice node. For Gloas `empty` and `full` nodes, this equals
        `block_root`, pointing to the same block's `pending` node. Otherwise, it is the beacon block's `parent_root`.
    parent_payload_status:
      description: "The payload status of the parent fork choice node. Null if the parent is not retained in the fork choice tree."
      oneOf:
        - type: "null"
        - type: string
          enum: [pending, empty, full]
    justified_epoch:
      $ref: './primitive.yaml#/Uint64'
    finalized_epoch:
      $ref: './primitive.yaml#/Uint64'
    weight:
      $ref: './primitive.yaml#/Gwei'
      description: "The raw stored weight of this fork choice node in Gwei."
    validity:
      type: string
      enum: [valid, invalid, optimistic]
      description: "The execution validity of the chain ending at `execution_block_hash`. For pre-merge blocks, this is `valid`."
    execution_block_hash:
      $ref: './primitive.yaml#/Hash32'
      description: |
        For `full` nodes, the block's execution payload hash. For Gloas `pending` and `empty` nodes,
        the bid's `parent_block_hash`. Zero for pre-merge blocks.
    payload_attester_count:
      $ref: './primitive.yaml#/Uint64'
      description: "Number of PTC positions for which a vote has been received."
    payload_availability_yes_count:
      $ref: './primitive.yaml#/Uint64'
      description: "Number of PTC positions voting that the payload is present."
    payload_data_availability_yes_count:
      $ref: './primitive.yaml#/Uint64'
      description: "Number of PTC positions voting that the blob data is available."
    extra_data:
      $ref: '#/ExtraData'
